name: Edge Agent CI

on:
  workflow_dispatch:
  push:
    paths:
      - "apps/edge-agent/**"
      - ".github/workflows/edge-agent-ci.yml"
  pull_request:
    paths:
      - "apps/edge-agent/**"
      - ".github/workflows/edge-agent-ci.yml"

env:
  LIBSRT_VERSION: "1.5.7"
  LIBSRT_COMMIT: "899348d8318eb9a3c5a5b6ec43c4a1114288773a"

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/edge-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Restore Edge solution
        run: dotnet restore iPresenterPlux.Edge.sln
      - name: Restore desktop shell tests
        run: dotnet restore tests/iPresenterPlux.Edge.Desktop.Tests/iPresenterPlux.Edge.Desktop.Tests.csproj
      - name: Build desktop shell tests
        run: dotnet build tests/iPresenterPlux.Edge.Desktop.Tests/iPresenterPlux.Edge.Desktop.Tests.csproj -c Release --no-restore
      - name: Test desktop shell
        run: dotnet test tests/iPresenterPlux.Edge.Desktop.Tests/iPresenterPlux.Edge.Desktop.Tests.csproj -c Release --no-build --no-restore
      - name: Build shared core tests
        run: dotnet build tests/iPresenterPlux.Edge.Core.Tests/iPresenterPlux.Edge.Core.Tests.csproj -c Release --no-restore
      - name: Test shared core
        run: dotnet test tests/iPresenterPlux.Edge.Core.Tests/iPresenterPlux.Edge.Core.Tests.csproj -c Release --no-build --no-restore
      - name: Build Windows platform
        run: dotnet build src/iPresenterPlux.Edge.Windows/iPresenterPlux.Edge.Windows.csproj -c Release --no-restore
      - name: Build pinned libsrt runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $source = Join-Path $env:RUNNER_TEMP "libsrt-source"
          if (Test-Path $source) { Remove-Item -Recurse -Force $source }
          git clone --depth 1 --branch "v$env:LIBSRT_VERSION" https://github.com/Haivision/srt.git $source
          Push-Location $source
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $env:LIBSRT_COMMIT) { throw "Unexpected libsrt commit: $actual" }
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install openssl:x64-windows-static-md
          cmake -S . -B build -A x64 `
            -DENABLE_SHARED=ON `
            -DENABLE_STATIC=OFF `
            -DENABLE_APPS=OFF `
            -DENABLE_UNITTESTS=OFF `
            -DENABLE_STDCXX_SYNC=ON `
            -DOPENSSL_USE_STATIC_LIBS=TRUE `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT\scripts\buildsystems\vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static-md
          cmake --build build --config Release --parallel 2
          Pop-Location

          $dll = Get-ChildItem -Path (Join-Path $source "build") -Recurse -File -Filter "srt.dll" | Select-Object -First 1
          if (-not $dll) { throw "The pinned libsrt build did not produce srt.dll" }
          New-Item -ItemType Directory -Force -Path "publish/libsrt-stage" | Out-Null
          Copy-Item $dll.FullName "publish/libsrt-stage/srt.dll"
          Copy-Item (Join-Path $source "LICENSE") "publish/libsrt-stage/LICENSE"
          @(
            "libsrt=$env:LIBSRT_VERSION",
            "commit=$env:LIBSRT_COMMIT",
            "source=https://github.com/Haivision/srt"
          ) | Set-Content -Encoding utf8 "publish/libsrt-stage/VERSION.txt"
      - name: Verify pinned Windows libsrt runtime
        shell: pwsh
        run: |
          python -c "import ctypes, pathlib; p=pathlib.Path(r'publish/libsrt-stage/srt.dll').resolve(); lib=ctypes.CDLL(str(p)); lib.srt_getversion.restype=ctypes.c_uint; v=lib.srt_getversion(); print(f'libsrt runtime: {v>>16}.{(v>>8)&255}.{v&255}'); assert v >= 0x010507"
      - name: Publish self-contained Windows Edge runtime
        run: dotnet publish src/iPresenterPlux.Edge.Windows/iPresenterPlux.Edge.Windows.csproj -c Release -r win-x64 --self-contained true -o publish/windows-runtime
      - name: Stage Windows libsrt runtime
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "publish/windows-runtime/libSrt" | Out-Null
          Copy-Item "publish/libsrt-stage/*" "publish/windows-runtime/libSrt/" -Recurse
      - name: Publish self-contained Windows desktop shell
        run: dotnet publish src/iPresenterPlux.Edge.Desktop/iPresenterPlux.Edge.Desktop.csproj -c Release -r win-x64 --self-contained true -o publish/windows-app
      - name: Stage Windows Edge runtime under desktop shell
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "publish/windows-app/runtime" | Out-Null
          Copy-Item "publish/windows-runtime/*" "publish/windows-app/runtime/" -Recurse
          if (-not (Test-Path "publish/windows-app/iPresenterPlux.Edge.Desktop.exe")) { throw "Desktop shell executable is missing" }
          if (-not (Test-Path "publish/windows-app/runtime/iPresenterPlux.Edge.Windows.exe")) { throw "Edge runtime executable is missing" }
          if (-not (Test-Path "publish/windows-app/runtime/libSrt/srt.dll")) { throw "Bundled libsrt runtime is missing" }
      - name: Scan Windows licensing package
        shell: pwsh
        run: python scripts/licensing-package-scan.py publish/windows-app
      - name: Smoke SRT contribution against MediaMTX
        shell: pwsh
        run: ./smoke/run-mediamtx-smoke.ps1
      - name: Upload Windows Edge desktop artifact
        uses: actions/upload-artifact@v4
        with:
          name: ipresenterplux-edge-windows
          path: apps/edge-agent/publish/windows-app
          if-no-files-found: error
          retention-days: 14

  macos:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: apps/edge-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Restore Edge solution
        run: dotnet restore iPresenterPlux.Edge.sln
      - name: Restore desktop shell tests
        run: dotnet restore tests/iPresenterPlux.Edge.Desktop.Tests/iPresenterPlux.Edge.Desktop.Tests.csproj
      - name: Build desktop shell tests
        run: dotnet build tests/iPresenterPlux.Edge.Desktop.Tests/iPresenterPlux.Edge.Desktop.Tests.csproj -c Release --no-restore
      - name: Test desktop shell
        run: dotnet test tests/iPresenterPlux.Edge.Desktop.Tests/iPresenterPlux.Edge.Desktop.Tests.csproj -c Release --no-build --no-restore
      - name: Build shared core tests
        run: dotnet build tests/iPresenterPlux.Edge.Core.Tests/iPresenterPlux.Edge.Core.Tests.csproj -c Release --no-restore
      - name: Test shared core
        run: dotnet test tests/iPresenterPlux.Edge.Core.Tests/iPresenterPlux.Edge.Core.Tests.csproj -c Release --no-build --no-restore
      - name: Build macOS platform
        run: dotnet build src/iPresenterPlux.Edge.MacOS/iPresenterPlux.Edge.MacOS.csproj -c Release --no-restore
      - name: Build native Swift media bridge
        working-directory: apps/edge-agent/native/macos/iPresenterPlux.MediaBridge
        run: swift build -c release
      - name: Build pinned libsrt runtime
        shell: bash
        run: |
          set -euo pipefail
          brew install openssl@3
          source_dir="$RUNNER_TEMP/libsrt-source"
          rm -rf "$source_dir"
          git clone --depth 1 --branch "v${LIBSRT_VERSION}" https://github.com/Haivision/srt.git "$source_dir"
          actual="$(git -C "$source_dir" rev-parse HEAD)"
          test "$actual" = "$LIBSRT_COMMIT"
          openssl_root="$(brew --prefix openssl@3)"
          cmake -S "$source_dir" -B "$source_dir/build" \
            -DCMAKE_BUILD_TYPE=Release \
            -DENABLE_SHARED=ON \
            -DENABLE_STATIC=OFF \
            -DENABLE_APPS=OFF \
            -DENABLE_UNITTESTS=OFF \
            -DENABLE_STDCXX_SYNC=ON
          cmake --build "$source_dir/build" --config Release --parallel 2

          dylib="$(find "$source_dir/build" -type f -name 'libsrt*.dylib' | head -n 1)"
          test -n "$dylib"
          mkdir -p publish/libsrt-stage
          cp "$dylib" publish/libsrt-stage/libsrt.dylib
          cp "$openssl_root/lib/libssl.3.dylib" publish/libsrt-stage/libssl.3.dylib
          cp "$openssl_root/lib/libcrypto.3.dylib" publish/libsrt-stage/libcrypto.3.dylib

          srt_ssl_dep="$(otool -L publish/libsrt-stage/libsrt.dylib | awk '/libssl/{print $1; exit}')"
          srt_crypto_dep="$(otool -L publish/libsrt-stage/libsrt.dylib | awk '/libcrypto/{print $1; exit}')"
          ssl_crypto_dep="$(otool -L publish/libsrt-stage/libssl.3.dylib | awk '/libcrypto/{print $1; exit}')"
          test -n "$srt_ssl_dep"
          test -n "$srt_crypto_dep"
          test -n "$ssl_crypto_dep"
          install_name_tool -change "$srt_ssl_dep" "@loader_path/libssl.3.dylib" publish/libsrt-stage/libsrt.dylib
          install_name_tool -change "$srt_crypto_dep" "@loader_path/libcrypto.3.dylib" publish/libsrt-stage/libsrt.dylib
          install_name_tool -change "$ssl_crypto_dep" "@loader_path/libcrypto.3.dylib" publish/libsrt-stage/libssl.3.dylib
          install_name_tool -id "@rpath/libsrt.dylib" publish/libsrt-stage/libsrt.dylib
          install_name_tool -id "@rpath/libssl.3.dylib" publish/libsrt-stage/libssl.3.dylib
          install_name_tool -id "@rpath/libcrypto.3.dylib" publish/libsrt-stage/libcrypto.3.dylib

          cp "$source_dir/LICENSE" publish/libsrt-stage/LICENSE
          cat > publish/libsrt-stage/VERSION.txt <<EOF
          libsrt=${LIBSRT_VERSION}
          commit=${LIBSRT_COMMIT}
          source=https://github.com/Haivision/srt
          EOF

          for library in publish/libsrt-stage/*.dylib; do
            echo "Dependencies for $library"
            otool -L "$library"
            if otool -L "$library" | tail -n +2 | grep -E '/(opt|usr/local)/'; then
              echo "$library unexpectedly depends on a package-manager path" >&2
              exit 1
            fi
          done
      - name: Verify pinned macOS libsrt runtime
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import ctypes
          from pathlib import Path
          p = Path("publish/libsrt-stage/libsrt.dylib").resolve()
          lib = ctypes.CDLL(str(p))
          lib.srt_getversion.restype = ctypes.c_uint
          version = lib.srt_getversion()
          print(f"libsrt runtime: {version >> 16}.{(version >> 8) & 255}.{version & 255}")
          assert version >= 0x010507
          PY
      - name: Publish self-contained macOS Edge runtime
        run: dotnet publish src/iPresenterPlux.Edge.MacOS/iPresenterPlux.Edge.MacOS.csproj -c Release -r osx-arm64 --self-contained true -o publish/macos-runtime
      - name: Stage native macOS bridge and libsrt runtime
        shell: bash
        run: |
          mkdir -p publish/macos-runtime/libSrt
          cp native/macos/iPresenterPlux.MediaBridge/.build/release/libiPresenterPluxMediaBridge.dylib publish/macos-runtime/
          cp -R publish/libsrt-stage/. publish/macos-runtime/libSrt/
      - name: Publish self-contained macOS desktop shell
        run: dotnet publish src/iPresenterPlux.Edge.Desktop/iPresenterPlux.Edge.Desktop.csproj -c Release -r osx-arm64 --self-contained true -o publish/macos-app
      - name: Stage macOS Edge runtime under desktop shell
        shell: bash
        run: |
          mkdir -p publish/macos-app/runtime
          cp -R publish/macos-runtime/. publish/macos-app/runtime/
          test -x publish/macos-app/iPresenterPlux.Edge.Desktop
          test -x publish/macos-app/runtime/iPresenterPlux.Edge.MacOS
          test -f publish/macos-app/runtime/libiPresenterPluxMediaBridge.dylib
          test -f publish/macos-app/runtime/libSrt/libsrt.dylib
      - name: Scan macOS licensing package
        shell: bash
        run: python3 scripts/licensing-package-scan.py publish/macos-app
      - name: Smoke SRT contribution against MediaMTX
        shell: bash
        run: bash ./smoke/run-mediamtx-smoke.sh
      - name: Upload macOS Edge desktop artifact
        uses: actions/upload-artifact@v4
        with:
          name: ipresenterplux-edge-macos
          path: apps/edge-agent/publish/macos-app
          if-no-files-found: error
          retention-days: 14
