name: Edge Agent CI

on:
  push:
    paths:
      - "apps/edge-agent/**"
      - ".github/workflows/edge-agent-ci.yml"
  pull_request:
    paths:
      - "apps/edge-agent/**"
      - ".github/workflows/edge-agent-ci.yml"

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/edge-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Restore shared core
        run: dotnet restore src/iPresenterPlux.Edge.Core/iPresenterPlux.Edge.Core.csproj
      - name: Build shared core
        run: dotnet build src/iPresenterPlux.Edge.Core/iPresenterPlux.Edge.Core.csproj -c Release --no-restore
      - name: Restore Windows platform
        run: dotnet restore src/iPresenterPlux.Edge.Windows/iPresenterPlux.Edge.Windows.csproj
      - name: Build Windows platform
        run: dotnet build src/iPresenterPlux.Edge.Windows/iPresenterPlux.Edge.Windows.csproj -c Release --no-restore

  macos:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: apps/edge-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Restore shared core
        run: dotnet restore src/iPresenterPlux.Edge.Core/iPresenterPlux.Edge.Core.csproj
      - name: Build shared core
        run: dotnet build src/iPresenterPlux.Edge.Core/iPresenterPlux.Edge.Core.csproj -c Release --no-restore
      - name: Restore macOS platform
        run: dotnet restore src/iPresenterPlux.Edge.MacOS/iPresenterPlux.Edge.MacOS.csproj
      - name: Build macOS platform
        run: dotnet build src/iPresenterPlux.Edge.MacOS/iPresenterPlux.Edge.MacOS.csproj -c Release --no-restore
      - name: Build native Swift media bridge
        working-directory: apps/edge-agent/native/macos/iPresenterPlux.MediaBridge
        run: swift build -c release
