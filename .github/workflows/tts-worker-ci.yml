name: TTS Worker CI

on:
  workflow_dispatch:
  push:
    paths:
      - "apps/tts-worker/**"
      - "deploy/systemd/ipresenterplux-tts.service"
      - ".github/workflows/tts-worker-ci.yml"
  pull_request:
    paths:
      - "apps/tts-worker/**"
      - "deploy/systemd/ipresenterplux-tts.service"
      - ".github/workflows/tts-worker-ci.yml"

permissions:
  contents: read

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/tts-worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/tts-worker/pyproject.toml
      - name: Install worker and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install ".[dev]"
      - name: Compile worker sources
        run: python -m compileall -q ipresenter_tts tests
      - name: Run worker contract tests
        run: python -m pytest
