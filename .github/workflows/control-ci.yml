name: Control Portal CI

on:
  workflow_dispatch:
  push:
    paths:
      - "apps/control/**"
      - "config/mediamtx.yml"
      - "package.json"
      - ".github/workflows/control-ci.yml"
      - ".github/workflows/deploy.yml"
      - "ops/deploy/**"
  pull_request:
    paths:
      - "apps/control/**"
      - "config/mediamtx.yml"
      - "package.json"
      - ".github/workflows/control-ci.yml"
      - ".github/workflows/deploy.yml"
      - "ops/deploy/**"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ipresenterplux_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ipresenterplux_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: apps/control
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/ipresenterplux_ci
      REDIS_URL: redis://127.0.0.1:6379
      AUTH_SECRET: ci-only-not-a-production-secret-please-replace
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/control/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Create CI environment file
        run: |
          cat > .env.local <<EOF
          DATABASE_URL=${DATABASE_URL}
          REDIS_URL=${REDIS_URL}
          AUTH_SECRET=${AUTH_SECRET}
          EOF
      - name: Migrate CI database
        run: pnpm db:migrate
      - name: Seed compact public-domain Bible fixture
        run: |
          psql "$DATABASE_URL" <<'SQL'
          INSERT INTO bible_versions
            (id,name,abbreviation,language_code,license_kind,source_url,source_revision,local_enabled)
          VALUES
            ('WEBP','World English Bible','WEBP','en','public_domain','https://ebible.org/details.php?id=engwebp','ci-fixture',true)
          ON CONFLICT (id) DO NOTHING;

          INSERT INTO bible_books(version_id,book_code,canonical_name,book_order,testament)
          VALUES
            ('WEBP','GEN','Genesis',1,'OT'),
            ('WEBP','JOH','John',43,'NT')
          ON CONFLICT (version_id,book_code) DO NOTHING;

          INSERT INTO bible_verses(version_id,book_code,chapter,verse,text)
          VALUES
            ('WEBP','GEN',1,1,'In the beginning, God created the heavens and the earth.'),
            ('WEBP','JOH',3,16,'For God so loved the world, that he gave his one and only Son, that whoever believes in him should not perish, but have eternal life.'),
            ('WEBP','JOH',3,17,'For God didn''t send his Son into the world to judge the world, but that the world should be saved through him.')
          ON CONFLICT (version_id,book_code,chapter,verse) DO UPDATE SET text=EXCLUDED.text;

          UPDATE services SET active_bible_version='WEBP';
          SQL
      - name: Lint
        run: pnpm lint
      - name: Writable database self-test safety guard
        run: pnpm test:db-selftest-safety
      - name: Subscription entitlement schema self-test
        run: pnpm test:subscription-schema
      - name: Secure product-key self-test
        run: pnpm test:product-key
      - name: Signed entitlement envelope self-test
        run: pnpm test:entitlement-signing
      - name: Activation and renewal API self-test
        run: pnpm test:activation-api
      - name: Licensing administration self-test
        run: pnpm test:licensing-admin
      - name: Entitlement operation gating self-test
        run: pnpm test:entitlement-gating
      - name: Licensing release-security self-test
        run: pnpm test:licensing-release-security
      - name: Deployment handoff contract self-test
        working-directory: .
        run: |
          bash -n ops/deploy/ipresenterplux-deploy.sh
          node apps/control/scripts/deployment-contract-selftest.mjs
      - name: Scripture parser self-test
        run: pnpm test:scripture
      - name: Studio navigation route self-test
        run: pnpm test:studio-navigation
      - name: Local Bible library self-test
        run: pnpm test:bible-library
      - name: Manual Scripture selection self-test
        run: pnpm test:manual-scripture
      - name: Scripture workspace UI self-test
        run: pnpm test:scripture-workspace-ui
      - name: Whole-chapter Scripture rendering self-test
        run: pnpm test:scripture-whole-chapter
      - name: Edge operator catalog self-test
        run: pnpm test:edge-operator-catalog
      - name: Scripture quote integration self-test
        run: pnpm test:scripture-quote
      - name: Transcript and translation integration self-test
        run: pnpm test:transcript-window
      - name: Stream contribution security self-test
        run: pnpm test:stream-contribution
      - name: Stream session authority lifecycle self-test
        run: pnpm test:stream-session-authority
      - name: Service-end stream lifecycle self-test
        run: pnpm test:service-stream-lifecycle
      - name: Audience Studio contract self-test
        run: pnpm test:audience-studio
      - name: Public audience live-state self-test
        run: pnpm test:audience-live-state
      - name: Streaming Studio recovery self-test
        run: pnpm test:streaming-studio-recovery
      - name: Destination fan-out lifecycle self-test
        run: pnpm test:stream-fanout
      - name: Provider destination health self-test
        run: pnpm test:stream-provider-health
      - name: Demo account catalog and login UI self-test
        run: pnpm test:demo-accounts
      - name: RBAC UI capability matrix self-test
        run: pnpm test:rbac-ui
      - name: Operator workspace safety self-test
        run: pnpm test:operator-workspace
      - name: Intelligent Cockpit view-model self-test
        run: pnpm test:cockpit-view-model
      - name: Predictive Next self-test
        run: pnpm test:cockpit-predictive-next
      - name: Cockpit typed command self-test
        run: pnpm test:cockpit-command
      - name: Cockpit smart attention self-test
        run: pnpm test:cockpit-attention
      - name: Predictive Next recommendation persistence self-test
        run: pnpm test:cockpit-recommendations
      - name: Intelligent Cockpit shell self-test
        run: pnpm test:cockpit-shell
      - name: Intelligent Cockpit focus-mode self-test
        run: pnpm test:cockpit-focus
      - name: Cockpit role projection self-test
        run: pnpm test:cockpit-role-projection
      - name: Intelligent Cockpit acceptance self-test
        run: pnpm test:cockpit-acceptance
      - name: Songs and Media workspace self-test
        run: pnpm test:media-workspace
      - name: Cameras workspace self-test
        run: pnpm test:camera-workspace
      - name: AI Director workspace self-test
        run: pnpm test:ai-director
      - name: Service Archive workspace self-test
        run: pnpm test:archive
      - name: Studio route gating self-test
        run: pnpm test:studio-route-gating
      - name: Studio workspace acceptance self-test
        run: pnpm test:studio-workspaces-ci
      - name: Service Planner contract self-test
        run: pnpm test:service-planner-contract
      - name: Service Planner service API self-test
        run: pnpm test:service-planner-service
      - name: Service Planner item and preview self-test
        run: pnpm test:service-planner-item
      - name: Service Planner mutation self-test
        run: pnpm test:service-planner-mutation
      - name: Service Planner readiness lifecycle self-test
        run: pnpm test:service-planner-readiness
      - name: Service Planner list/create UI self-test
        run: pnpm test:service-planner-ui
      - name: Seed and verify isolated demo-role accounts
        run: |
          pnpm demo:seed
          pnpm test:demo-users
      - name: Validate production MediaMTX configuration
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          version="1.21.1"
          expected_sha256="653abc672a3e693f8d3b2717752492fdcfb8072291ec108d03d3dd857411b0ee"
          archive="$RUNNER_TEMP/mediamtx-${version}-linux-amd64.tar.gz"
          extract="$RUNNER_TEMP/mediamtx-${version}-linux-amd64"
          log="$RUNNER_TEMP/mediamtx-config-validation.log"
          url="https://github.com/bluenviron/mediamtx/releases/download/v${version}/mediamtx_v${version}_linux_amd64.tar.gz"

          curl -fsSL "$url" -o "$archive"
          printf '%s  %s\n' "$expected_sha256" "$archive" | sha256sum -c -
          rm -rf "$extract"
          mkdir -p "$extract"
          tar -xzf "$archive" -C "$extract"
          server="$(find "$extract" -type f -name mediamtx | head -n 1)"
          test -n "$server"
          chmod +x "$server"

          "$server" config/mediamtx.yml >"$log" 2>&1 &
          pid=$!
          cleanup() {
            kill "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          ready=0
          for _ in $(seq 1 40); do
            if ! kill -0 "$pid" 2>/dev/null; then
              echo "MediaMTX exited while loading production configuration." >&2
              cat "$log" >&2 || true
              exit 1
            fi
            if curl -fsS --max-time 1 http://127.0.0.1:9997/v3/info >/dev/null; then
              ready=1
              break
            fi
            sleep 0.25
          done

          if [ "$ready" -ne 1 ]; then
            echo "MediaMTX did not become healthy with production configuration." >&2
            cat "$log" >&2 || true
            exit 1
          fi
          echo "MediaMTX v${version} accepted the production configuration."
      - name: Production build
        run: pnpm build
      - name: Validate Studio route manifest
        run: pnpm test:studio-route-manifest
