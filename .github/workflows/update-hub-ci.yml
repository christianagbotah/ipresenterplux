name: Update Hub CI

on:
  workflow_dispatch:
  push:
    paths:
      - "apps/update-hub/**"
      - "ops/update-hub/**"
      - "deploy/nginx/updates.lightworldtech.com.conf"
      - "deploy/systemd/lightworld-update-hub.service"
      - "docs/runbooks/update-hub.md"
      - ".github/workflows/update-hub-ci.yml"
  pull_request:
    paths:
      - "apps/update-hub/**"
      - "ops/update-hub/**"
      - "deploy/nginx/updates.lightworldtech.com.conf"
      - "deploy/systemd/lightworld-update-hub.service"
      - "docs/runbooks/update-hub.md"
      - ".github/workflows/update-hub-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/update-hub
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.11.2
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: apps/update-hub/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Update Hub foundation selftest
        run: pnpm test
      - name: Signed release selftest
        run: pnpm test:release
      - name: Admin release selftest
        run: pnpm test:admin
      - name: Offline signing CLI selftest
        run: pnpm test:signing
      - name: Release key generator selftest
        run: pnpm test:keygen
      - name: Delta builder selftest
        run: pnpm test:delta
      - name: VPS deployment contract selftest
        run: pnpm test:deployment
      - name: TypeScript build
        run: pnpm build
