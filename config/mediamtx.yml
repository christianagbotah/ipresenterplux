logLevel: info
logDestinations: [stdout]
readTimeout: 10s
writeTimeout: 10s

api: true
apiAddress: 127.0.0.1:9997
metrics: true
metricsAddress: 127.0.0.1:9998
pprof: false

rtsp: false
rtmp: false
srt: true
srtAddress: :8890

hls: true
hlsAddress: 127.0.0.1:8888
hlsEncryption: false
hlsAllowOrigins:
  - https://ipresenterplux.lightworldtech.com
hlsVariant: lowLatency
hlsAlwaysRemux: false

webrtc: true
webrtcAddress: 127.0.0.1:8889
webrtcEncryption: false
webrtcAllowOrigins:
  - https://ipresenterplux.lightworldtech.com
webrtcLocalUDPAddress: :8189
webrtcLocalTCPAddress: :8190
webrtcIPsFromInterfaces: true
webrtcAdditionalHosts:
  - ipresenterplux.lightworldtech.com

moq: false

authMethod: http
authHTTPAddress: http://127.0.0.1:3011/api/v1/stream/router/auth
authHTTPExclude:
  - action: read
    path: "~^service/[0-9a-f-]{36}$"
  - action: api
  - action: metrics
  - action: pprof

paths:
  "~^service/[0-9a-f-]{36}$":
    source: publisher
    runOnReady: node apps/control/scripts/mediamtx-state-callback.mjs ready "$MTX_PATH"
    runOnReadyRestart: false
    runOnNotReady: node apps/control/scripts/mediamtx-state-callback.mjs not-ready "$MTX_PATH"
