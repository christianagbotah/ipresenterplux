logLevel: info
logDestinations: [stdout]
readTimeout: 10s
writeTimeout: 10s

api: true
apiAddress: 127.0.0.1:9997
metrics: true
metricsAddress: 127.0.0.1:9998
pprof: false

# Loopback RTSP is the internal fan-out source for the hardened server worker.
# It is not exposed externally; social RTMPS publishers read the already encoded
# H.264/AAC master here and stream-copy it without a second transcode.
rtsp: true
rtspAddress: 127.0.0.1:8554
rtmp: false
srt: true
srtAddress: :8890

hls: true
hlsAddress: 127.0.0.1:8888
hlsEncryption: false
hlsAllowOrigins:
  - https://ipresenterplux.lightworldtech.com
hlsVariant: lowLatency
hlsAlwaysRemux: false

webrtc: true
webrtcAddress: 127.0.0.1:8889
webrtcEncryption: false
webrtcAllowOrigins:
  - https://ipresenterplux.lightworldtech.com
webrtcLocalUDPAddress: :8189
webrtcLocalTCPAddress: :8190
webrtcIPsFromInterfaces: true
webrtcAdditionalHosts:
  - ipresenterplux.lightworldtech.com

moq: false

authMethod: http
authHTTPAddress: http://127.0.0.1:3011/api/v1/stream/router/auth
authHTTPExclude:
  - action: read
    path: "~^service/[0-9a-f-]{36}$"
  - action: api
  - action: metrics
  - action: pprof

paths:
  "~^service/[0-9a-f-]{36}$":
    source: publisher
    # Mark the master path authoritative first, then keep the per-destination
    # fan-out supervisor attached to this path. MediaMTX sends SIGINT to the
    # runOnAvailable process when the path becomes unavailable.
    runOnAvailable: sh -c 'node apps/control/scripts/mediamtx-state-callback.mjs ready "$MTX_PATH" && exec node apps/control/scripts/stream-fanout-worker.mjs "$MTX_PATH"'
    runOnAvailableRestart: false
    runOnUnavailable: node apps/control/scripts/mediamtx-state-callback.mjs not-ready "$MTX_PATH"
